<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Ledger · senchi.</title>
<meta name="description" content="A trading journal that works offline and syncs to your own database: log trades, attach chart evidence, and track R-based statistics.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#DBDBDB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#dashboard" aria-label="Session Ledger home">
      <img src="assets/mark-ink.png" alt="" class="mark mark-light" width="28" height="28">
      <img src="assets/mark-grey.png" alt="" class="mark mark-dark" width="28" height="28">
      <span class="wordmark">senchi<i></i></span><small>ledger</small>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#trades" data-nav="trades">Trades</a>
      <a href="#review" data-nav="review">Review</a>
      <a href="#playbook" data-nav="playbook">Playbook</a>
      <a href="#settings" data-nav="settings">Settings</a>
    </nav>
    <div class="top-r">
      <a class="sync" id="sync" href="#settings" hidden></a>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch theme" title="Theme"></button>
      <a class="btn primary" href="#new" title="New session (N)"><span aria-hidden="true">+</span> New session</a>
    </div>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="lightbox" hidden>
  <button class="lb-close icon-btn" type="button" aria-label="Close">×</button>
  <button class="lb-prev icon-btn" type="button" aria-label="Previous screenshot">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-next icon-btn" type="button" aria-label="Next screenshot">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="import.js?v=31"></script>
<script src="review.js?v=31"></script>
<script src="app.js?v=31"></script>
</body>
</html>
