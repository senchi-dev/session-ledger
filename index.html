<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Ledger</title>
<meta name="description" content="A local-first trading journal: log trades, attach chart evidence, and track R-based statistics.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121513'/%3E%3Cline x1='11' y1='7' x2='11' y2='25' stroke='%23F3F4F1' stroke-width='1.5'/%3E%3Crect x='8' y='11' width='6' height='9' rx='1' fill='%23F3F4F1'/%3E%3Cline x1='21' y1='5' x2='21' y2='21' stroke='%2334C28A' stroke-width='1.5'/%3E%3Crect x='18' y='8' width='6' height='9' rx='1' fill='%2334C28A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#dashboard" aria-label="Session Ledger home">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="mark">
        <line x1="8" y1="4" x2="8" y2="20" class="mk-w"/><rect x="5.5" y="8" width="5" height="8" rx="1" class="mk-b"/>
        <line x1="16" y1="2" x2="16" y2="16" class="mk-w2"/><rect x="13.5" y="5" width="5" height="7" rx="1" class="mk-g"/>
      </svg>
      <span>Session Ledger</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#trades" data-nav="trades">Trades</a>
      <a href="#playbook" data-nav="playbook">Playbook</a>
      <a href="#settings" data-nav="settings">Settings</a>
    </nav>
    <div class="top-r">
      <button class="icon-btn" id="theme" type="button" aria-label="Switch theme" title="Theme"></button>
      <a class="btn primary" href="#new" title="New entry (N)"><span aria-hidden="true">+</span> New entry</a>
    </div>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="lightbox" hidden>
  <button class="lb-close icon-btn" type="button" aria-label="Close">×</button>
  <button class="lb-prev icon-btn" type="button" aria-label="Previous screenshot">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-next icon-btn" type="button" aria-label="Next screenshot">›</button>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
